[package]
name = "postflop-solver"
version = "0.1.0"
authors = ["Wataru Inariba"]
edition = "2021"
# 1.97 is required by `u64::isolate_lowest_one` (src/bunching.rs) and
# `AtomicU64::try_update` (src/atomic_float.rs). Verified by the `msrv` CI job.
rust-version = "1.97"
description = "An open-source postflop solver for Texas hold'em poker"
documentation = "https://github.com/mattallty/postflop-solver#readme"
repository = "https://github.com/mattallty/postflop-solver"
license = "AGPL-3.0-or-later"


# The sidecar lives here too, so the engine and the program that exposes it over a pipe move
# together. A root package that is also a workspace root keeps every existing command targeting
# the engine alone — `cargo build`, `cargo test`, `cargo clippy` here are unchanged — and the
# sidecar is reached by name.
[workspace]
members = ["pkwiz-solver"]

[dependencies]
bincode = { version = "2", optional = true }
once_cell = "1.18.0"
rayon = { version = "1.8.0", optional = true }
regex = "1.9.6"
zstd = { version = "0.12.4", optional = true, default-features = false }

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
default = ["bincode", "rayon"]
custom-alloc = []
rayon = ["dep:rayon", "zstd?/zstdmt"]
