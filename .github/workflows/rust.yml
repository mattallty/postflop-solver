name: Rust

# `on: [push, pull_request]` ran every PR commit twice: once for the branch push and once
# for the pull request. Limiting `push` to the default branch keeps post-merge coverage of
# `main` while leaving branch commits to the `pull_request` trigger alone.
on:
  push:
    branches: [main]
  pull_request:

# Cancel superseded runs when new commits land on the same branch or PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install nightly
      run: |
        rustup toolchain install nightly
        rustup +nightly component add clippy
    # Caches ~/.cargo and target/. Must run after the toolchains are installed, since the
    # cache key includes the rustc version. Dependencies (notably zstd, which builds C code)
    # dominate a cold build.
    - uses: Swatinem/rust-cache@v2
      with:
        key: build
    - name: Build
      run: |
        cargo build --release --locked --features zstd
        cargo +nightly build --release --locked --features custom-alloc
        cargo run --release --locked --example basic
        cargo run --release --locked --example file_io
        cargo run --release --locked --example node_locking
        cargo run --release --locked --example from_config
    # No `rayon`, no `bincode`: the single-threaded solver path and the bincode-less build
    # exist and are advertised, but nothing else in CI ever compiles them, so they can only
    # rot silently. A check is enough — the full test suite needs `bincode` for its file
    # round-trips.
    - name: Check without default features
      run: cargo check --release --locked --no-default-features
    - name: Run tests
      run: |
        cargo test --release --locked --features zstd
        cargo +nightly test --release --locked --features custom-alloc -- --test-threads 1
    - name: Clippy
      run: |
        cargo clippy --release --features zstd -- -A clippy::needless_range_loop
        cargo +nightly clippy --release --features custom-alloc -- -A clippy::needless_range_loop
    - name: Check formatting
      run: cargo fmt --all --check
    - name: Check documentation
      run: cargo doc --release

  # The `build` job above tracks whatever the runner's `stable` happens to be, so it cannot
  # notice when a change quietly raises the minimum supported Rust version. This job pins the
  # MSRV declared in Cargo.toml, and fails if the crate stops building on it.
  msrv:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Install MSRV toolchain
      run: rustup toolchain install 1.97 --profile minimal
    # Separate key from the `build` job: different toolchain, so different artifacts.
    - uses: Swatinem/rust-cache@v2
      with:
        key: msrv
    - name: Build with MSRV
      run: |
        cargo +1.97 build --release --locked --features zstd
        cargo +1.97 test --release --locked --features zstd

  # The `build` job above runs at the repository root, which is the engine's own package — a root
  # package that is also a workspace root keeps `cargo build`/`test`/`clippy` there targeting the
  # engine alone. The sidecar therefore needs asking for by name, or it would go untested.
  sidecar:
    name: sidecar (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu pins the MSRV, so the sidecar cannot quietly outgrow the declared minimum.
          - os: ubuntu-latest
            toolchain: '1.97'
          # macOS tracks `stable` — the toolchain the release pipeline actually ships — so a
          # published non-Linux platform runs the whole suite here, not only `--version`.
          # Path handling in save/open is exactly the kind of bug a Linux-only suite cannot
          # catch, and until now every released macOS binary had passed nothing but the smoke
          # check.
          - os: macos-latest
            toolchain: stable
    steps:
    - uses: actions/checkout@v7
      with:
        # `engine_rev` compares the engine's `src/` against the commit ENGINE_REV names, which a
        # shallow clone does not contain. The test skips rather than fails when it is missing, so
        # without this the check would quietly become a no-op here — which is the failure mode it
        # exists to prevent.
        fetch-depth: 0
    - name: Install the ${{ matrix.toolchain }} toolchain
      run: rustup toolchain install ${{ matrix.toolchain }} --profile minimal --component clippy
    - uses: Swatinem/rust-cache@v2
      with:
        key: sidecar-${{ matrix.os }}
    - name: Build and test
      run: |
        cargo +${{ matrix.toolchain }} build --release --locked -p pkwiz-solver
        cargo +${{ matrix.toolchain }} test --release --locked -p pkwiz-solver
    # `-A needless_range_loop` for the same reason the engine's own clippy step carries it: the
    # engine is a workspace member now, so linting the sidecar lints it too, and its indexed loops
    # are deliberate.
    - name: Clippy
      run: cargo +${{ matrix.toolchain }} clippy --release --locked -p pkwiz-solver --all-targets -- -D warnings -A clippy::needless_range_loop
    # The release artifacts are what an application downloads, and it probes them with exactly
    # this before trusting one. Failing here beats failing on a user's machine.
    - name: It answers --version
      run: ./target/release/pkwiz-solver --version
      shell: bash
